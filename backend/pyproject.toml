[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI — multimodal document intelligence backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "email-validator>=2.2",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "celery[redis]>=5.4",
    "docling>=2.15",
    "httpx>=0.28",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "moto[s3]>=5.0",
    "pypdf>=5.1",
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]  # autogenerated; reviewed by hand, checked by `alembic check`

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT"]
ignore = ["E501"]  # `ruff format` owns line length; remaining long lines are strings/SQL

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "PT018", "RUF059"]  # test-only style relaxations
"benchmarks/**" = ["S311", "RUF005", "ASYNC240", "RUF059", "S603", "S607"]  # deterministic synthetic data, not crypto

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*", "pypdfium2.*", "kombu.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Docling boundary: docling-core doesn't declare its re-exports; contained to the adapters.
module = ["app.extraction.layout.docling_adapter", "app.extraction.parser"]
disable_error_code = ["attr-defined", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false  # Celery's task decorator is untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "live: requires real external model provider credentials (skipped when absent)",
    "integration: requires running Postgres/Redis (docker compose)",
    "slow: runs real ML models (Docling); minutes on first run",
    "full_pipeline: integration test running every production pipeline stage",
]
